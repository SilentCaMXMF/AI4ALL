name: Scrape Free AI Models with Feedback

on:
  schedule:
    # Run every 6 hours to check for new free models
    - cron: '0 */6 * * *'
  
  # Run on push to main
  push:
    branches:
      - main
  
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to production after scrape?'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

# Restrict permissions to minimum required
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed for git commit and GitHub Pages deploy
      pages: write
      id-token: write
    
    steps:
      - name: Generate GitHub App installation token
        id: generate-token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.APP_ID }}
          private_key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          token: ${{ steps.generate-token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create data directory
        run: mkdir -p data

      - name: Run scraper (fetch free AI models with cross-platform feedback)
        env:
          # GitHub API for searching issues/discussions
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
          GITHUB_USERNAME: ${{ secrets.GITHUB_USERNAME }}
          
          # Reddit API for community feedback
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
          
          # Stack Overflow (optional key)
          STACKOVERFLOW_KEY: ${{ secrets.STACKOVERFLOW_KEY }}
          
          # Enhanced verification settings
          ENABLE_HUGGINGFACE: true
          ENABLE_HACKERNEWS: true
          ENABLE_X: true
        run: npx tsx src/scraper/enhanced-cli.ts

      - name: Run tests
        run: |
          npm run typecheck
          npm test

      - name: Upload scraped data
        uses: actions/upload-artifact@v4
        with:
          name: free-models-data
          path: data/
          retention-days: 7

      - name: Build Astro site
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: astro-build
          path: dist/
          retention-days: 7

      - name: Commit and push data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # Add all data files to commit
          git add -f data/aggregated-data.json
          git add -f data/verification-database.json
          git add -f data/verification-history.json
          git add -f data/update-state.json
          git add -f data/modelsdev-state.json
          git add -f data/github-scrape-state.json
          git add -f data/api-keys.json
          git add -f data/pipeline-config.json
          git diff --staged --quiet || (git commit -m "Update free AI models with feedback [$(date +%Y-%m-%d_%H:%M)]" && git push)

      - name: Deploy to production
        if: github.ref == 'refs/heads/main' && (github.event.inputs.deploy == 'true' || github.event_name == 'schedule')
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ steps.generate-token.outputs.token }}
          publish_dir: ./dist
          force_orphan: true

  notify:
    needs: scrape
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Notify on success
        if: needs.scrape.result == 'success'
        run: echo "✅ Free AI models data updated successfully with cross-platform feedback!"

      - name: Notify on failure
        if: needs.scrape.result == 'failure'
        run: |
          echo "❌ Workflow failed!"
          echo "Scrape result: ${{ needs.scrape.result }}"

      - name: Notify on test failure
        if: contains(needs.scrape.outputs.tests, 'failed')
        run: |
          echo "❌ Some tests failed during scraping!"
          echo "Test results: ${{ needs.scrape.outputs.tests }}"

      - name: Notify on deployment
        if: needs.scrape.result == 'success' && github.ref == 'refs/heads/main' && (github.event.inputs.deploy == 'true' || github.event_name == 'schedule')
        run: echo "🚀 Successfully deployed to production!"

  security-audit:
    needs: scrape
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level=moderate

      - name: Run bundle size check
        run: |
          npm run build
          echo "Build completed successfully"

      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: |
            npm-audit.html
            bundle-size.txt
          retention-days: 30
