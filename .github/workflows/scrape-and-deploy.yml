name: Scrape Free AI Models

on:
  schedule:
    # Run every hour to check for new free models
    - cron: '0 * * * *'
  
  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create data directory
        run: mkdir -p data

      - name: Run scraper (fetch free AI models)
        run: npx tsx src/scraper/cli.ts

      - name: Upload scraped data
        uses: actions/upload-artifact@v4
        with:
          name: free-models-data
          path: data/aggregated-data.json
          retention-days: 7

      - name: Commit and push data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -f data/aggregated-data.json
          git diff --staged --quiet || (git commit -m "Update free AI models data [$(date +%Y-%m-%d_%H:%M)]" && git push)

  notify:
    needs: scrape
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Notify on success
        if: needs.scrape.result == 'success'
        run: echo "✅ Free AI models data updated successfully!"

      - name: Notify on failure
        if: needs.scrape.result == 'failure'
        run: |
          echo "❌ Workflow failed!"
          echo "Scrape result: ${{ needs.scrape.result }}"
