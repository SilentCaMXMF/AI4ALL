name: Scrape Free AI Models with Feedback

on:
  schedule:
    # Run every hour to check for new free models
    - cron: '0 * * * *'
  
  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npx tsc -p tsconfig.scraper.json

      - name: Run scraper
        env:
          # GitHub API for searching issues/discussions
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ secrets.GITHUB_USERNAME }}
          
          # Reddit API for community feedback
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
          
          # Discord API for real-time feedback
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          
          # X (Twitter) API for trending topics
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          
          # Stack Overflow (optional key)
          STACKOVERFLOW_KEY: ${{ secrets.STACKOVERFLOW_KEY }}
          PLATFORMS: ${{ github.event.inputs.platforms || 'all' }}
        run: |
          if [ "$PLATFORMS" = "all" ]; then
            node dist/scraper/index.js
          else
            node dist/scraper/index.js --platforms $PLATFORMS
          fi

      - name: Upload scraped data
        uses: actions/upload-artifact@v4
        with:
          name: free-models-data
          path: data/aggregated-data.json
          retention-days: 7

      - name: Commit and push data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -f data/aggregated-data.json
          git diff --staged --quiet || (git commit -m "Update free AI models with feedback [$(date +%Y-%m-%d_%H:%M)]" && git push)

  notify:
    needs: scrape
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Notify on success
        if: needs.scrape.result == 'success'
        run: echo "✅ Free AI models data updated successfully with cross-platform feedback!"

      - name: Notify on failure
        if: needs.scrape.result == 'failure'
        run: |
          echo "❌ Workflow failed!"
          echo "Scrape result: ${{ needs.scrape.result }}"
