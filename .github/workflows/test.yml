name: Scraper Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Test scraper initialization
        run: |
          # Test that the scraper can be imported without errors
          node -e "
            import('./src/scraper/index.js').then(m => {
              console.log('✓ Scraper module loaded successfully');
              console.log('Available exports:', Object.keys(m));
            }).catch(err => {
              console.error('✗ Failed to load scraper:', err);
              process.exit(1);
            });
          "
