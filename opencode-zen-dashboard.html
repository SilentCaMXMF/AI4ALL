<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opencode Zen - Free AI Models & Providers</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #06b6d4;
            --accent: #10b981;
            --background: #0f172a;
            --surface: #1e293b;
            --surface-light: #334155;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --text-subtle: #64748b;
            --border: rgba(148, 163, 184, 0.2);
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            color: var(--text);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* Header */
        header {
            text-align: center;
            padding: 60px 0 40px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1) 0%, rgba(6, 182, 212, 0.1) 100%);
            border-bottom: 1px solid var(--border);
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--text) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.125rem;
            margin-bottom: 32px;
        }

        /* Stats Bar */
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 32px;
            flex-wrap: wrap;
        }

        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px 32px;
            text-align: center;
            min-width: 160px;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--primary);
            display: block;
            line-height: 1;
            margin-bottom: 8px;
        }

        .stat-value.free {
            color: var(--success);
        }

        .stat-label {
            font-size: 0.875rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Main Content */
        main {
            padding: 40px 0;
        }

        .section {
            margin-bottom: 48px;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .provider-badge {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        /* Provider Section */
        .provider-section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 32px;
            margin-bottom: 32px;
        }

        .provider-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
            gap: 16px;
        }

        .provider-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .provider-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        .provider-name {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .provider-meta {
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        .provider-links {
            display: flex;
            gap: 12px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.875rem;
            text-decoration: none;
            transition: all 0.2s;
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
        }

        .btn-secondary {
            background: var(--surface-light);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--border);
        }

        /* Models Grid */
        .models-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .model-card {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.05) 0%, rgba(6, 182, 212, 0.05) 100%);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            transition: all 0.3s ease;
        }

        .model-card:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .model-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .model-name {
            font-size: 1.125rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 4px;
        }

        .model-family {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .free-badge {
            background: linear-gradient(135deg, var(--success) 0%, #059669 100%);
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .model-features {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }

        .feature-tag {
            background: var(--surface-light);
            border: 1px solid var(--border);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .feature-tag.enabled {
            background: rgba(16, 185, 129, 0.1);
            border-color: var(--success);
            color: var(--success);
        }

        .model-specs {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }

        .spec {
            background: var(--surface);
            padding: 12px;
            border-radius: 10px;
        }

        .spec-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .spec-value {
            font-weight: 700;
            color: var(--text);
        }

        .model-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

        .model-date {
            font-size: 0.75rem;
            color: var(--text-subtle);
        }

        /* Summary Table */
        .summary-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
        }

        .summary-table th,
        .summary-table td {
            padding: 16px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        .summary-table th {
            background: var(--surface-light);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .summary-table tr:last-child td {
            border-bottom: none;
        }

        .summary-table tr:hover td {
            background: rgba(99, 102, 241, 0.05);
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 40px 0;
            border-top: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-bottom: 16px;
        }

        .footer-links a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s;
        }

        .footer-links a:hover {
            color: var(--primary);
        }

        /* Loading State */
        .loading {
            text-align: center;
            padding: 60px;
            color: var(--text-muted);
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1 {
                font-size: 1.75rem;
            }

            .stats-bar {
                gap: 16px;
            }

            .stat-card {
                padding: 20px 24px;
                min-width: 140px;
            }

            .stat-value {
                font-size: 2rem;
            }

            .models-grid {
                grid-template-columns: 1fr;
            }

            .provider-header {
                flex-direction: column;
                text-align: center;
            }

            .provider-links {
                width: 100%;
                justify-content: center;
            }

            .model-header {
                flex-direction: column;
                gap: 12px;
            }

            .model-specs {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="logo">
                <div class="logo-icon">🤖</div>
            </div>
            <h1>Opencode Zen</h1>
            <p class="subtitle">Free AI Models & Providers Directory</p>
            
            <div class="stats-bar">
                <div class="stat-card">
                    <span class="stat-value free" id="free-models">-</span>
                    <span class="stat-label">Free Models</span>
                </div>
                <div class="stat-card">
                    <span class="stat-value" id="providers">-</span>
                    <span class="stat-label">Providers</span>
                </div>
                <div class="stat-card">
                    <span class="stat-value" id="total-models">-</span>
                    <span class="stat-label">Total Models</span>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Loading Opencode Zen models...</p>
        </div>

        <div id="content" style="display: none;">
            <div id="providers-container"></div>
            
            <div class="section">
                <div class="section-header">
                    <h2 class="section-title">📊 Complete Model List</h2>
                </div>
                <div style="overflow-x: auto;">
                    <table class="summary-table" id="summary-table">
                        <thead>
                            <tr>
                                <th>Model</th>
                                <th>Provider</th>
                                <th>Context</th>
                                <th>Features</th>
                                <th>Cost</th>
                            </tr>
                        </thead>
                        <tbody id="table-body">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <div class="footer-links">
                <a href="https://models.dev" target="_blank">Models.dev</a>
                <a href="index.html">Project Home</a>
                <a href="data/opencode-zen-models.json" target="_blank">Raw Data</a>
            </div>
            <p>Last updated: <span id="last-updated">-</span></p>
            <p style="margin-top: 8px; font-size: 0.75rem;">Data sourced from models.dev API</p>
        </div>
    </footer>

    <script>
        // Feature icons
        const featureIcons = {
            toolCall: '🔧',
            reasoning: '🧠',
            structuredOutput: '📋',
            attachments: '📎',
            openWeights: '🔓'
        };

        function formatNumber(num) {
            if (!num) return '-';
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num.toLocaleString();
        }

        function createModelCard(model) {
            const features = [];
            if (model.toolCall) features.push({ name: 'Tool Calling', icon: featureIcons.toolCall, enabled: true });
            if (model.reasoning) features.push({ name: 'Reasoning', icon: featureIcons.reasoning, enabled: true });
            if (model.structuredOutput) features.push({ name: 'Structured', icon: featureIcons.structuredOutput, enabled: true });
            if (model.attachments) features.push({ name: 'Attachments', icon: featureIcons.attachments, enabled: true });
            if (model.openWeights) features.push({ name: 'Open Weights', icon: featureIcons.openWeights, enabled: true });

            const featuresHtml = features.map(f => 
                `<span class="feature-tag enabled">${f.icon} ${f.name}</span>`
            ).join('');

            return `
                <div class="model-card">
                    <div class="model-header">
                        <div>
                            <div class="model-name">${model.name}</div>
                            <div class="model-family">${model.family || 'General'}</div>
                        </div>
                        <span class="free-badge">FREE</span>
                    </div>
                    
                    <div class="model-features">
                        ${featuresHtml}
                    </div>
                    
                    <div class="model-specs">
                        <div class="spec">
                            <div class="spec-label">Context Window</div>
                            <div class="spec-value">${formatNumber(model.contextLimit)} tokens</div>
                        </div>
                        <div class="spec">
                            <div class="spec-label">Output Limit</div>
                            <div class="spec-value">${formatNumber(model.outputLimit)} tokens</div>
                        </div>
                        <div class="spec">
                            <div class="spec-label">Input Cost</div>
                            <div class="spec-value" style="color: var(--success);">FREE</div>
                        </div>
                        <div class="spec">
                            <div class="spec-label">Output Cost</div>
                            <div class="spec-value" style="color: var(--success);">FREE</div>
                        </div>
                    </div>
                    
                    <div class="model-footer">
                        <div class="model-date">
                            Released: ${model.releaseDate ? new Date(model.releaseDate).toLocaleDateString() : 'N/A'}
                        </div>
                        <a href="${model.url}" target="_blank" class="btn btn-primary" style="padding: 8px 16px; font-size: 0.75rem;">
                            View Details →
                        </a>
                    </div>
                </div>
            `;
        }

        function createProviderSection(provider, models) {
            const firstModel = models[0];
            
            return `
                <div class="provider-section">
                    <div class="provider-header">
                        <div class="provider-info">
                            <div class="provider-icon">🏢</div>
                            <div>
                                <div class="provider-name">${provider}</div>
                                <div class="provider-meta">${models.length} free models available</div>
                            </div>
                        </div>
                        <div class="provider-links">
                            ${firstModel.providerUrl ? `<a href="${firstModel.providerUrl}" target="_blank" class="btn btn-secondary">📖 Docs</a>` : ''}
                            ${firstModel.npm ? `<a href="https://npmjs.com/package/${firstModel.npm}" target="_blank" class="btn btn-secondary">📦 NPM</a>` : ''}
                        </div>
                    </div>
                    
                    <div class="models-grid">
                        ${models.map(model => createModelCard(model)).join('')}
                    </div>
                </div>
            `;
        }

        function createTableRow(model) {
            const features = [];
            if (model.toolCall) features.push('🔧');
            if (model.reasoning) features.push('🧠');
            if (model.structuredOutput) features.push('📋');

            return `
                <tr>
                    <td>
                        <strong>${model.name}</strong>
                        <div style="font-size: 0.75rem; color: var(--text-muted); margin-top: 4px;">${model.family || 'General'}</div>
                    </td>
                    <td>${model.provider}</td>
                    <td>${formatNumber(model.contextLimit)}</td>
                    <td>${features.join(' ') || '-'}</td>
                    <td style="color: var(--success); font-weight: 600;">FREE</td>
                </tr>
            `;
        }

        async function loadData() {
            try {
                const response = await fetch('data/opencode-zen-models.json');
                if (!response.ok) throw new Error('Failed to load data');
                
                const data = await response.json();
                
                // Update stats
                document.getElementById('free-models').textContent = data.summary.freeModels;
                document.getElementById('providers').textContent = data.summary.providerCount;
                document.getElementById('total-models').textContent = data.summary.opencodeZenModels;
                document.getElementById('last-updated').textContent = new Date(data.lastUpdated).toLocaleString();
                
                // Create provider sections
                const providersContainer = document.getElementById('providers-container');
                let providersHtml = '';
                
                for (const [provider, models] of Object.entries(data.modelsByProvider)) {
                    providersHtml += createProviderSection(provider, models);
                }
                
                providersContainer.innerHTML = providersHtml;
                
                // Create summary table
                document.getElementById('table-body').innerHTML = data.models.map(createTableRow).join('');
                
                // Show content
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';
                
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('loading').innerHTML = `
                    <div style="padding: 40px;">
                        <div style="font-size: 3rem; margin-bottom: 16px;">⚠️</div>
                        <h3 style="margin-bottom: 8px;">Failed to Load Data</h3>
                        <p>Could not load Opencode Zen models. Please try again later.</p>
                        <p style="font-size: 0.75rem; color: var(--text-subtle); margin-top: 16px;">${error.message}</p>
                    </div>
                `;
            }
        }

        loadData();
    </script>
</body>
</html>
